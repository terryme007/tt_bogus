name: GmailBuy 库存监控

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'stock_watch/gmailbuy_monitor.py'
      - 'stock_watch/keepalive.py'
      - '.github/workflows/gmailbuy-stock.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: gmailbuy-stock-monitor
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest stock and notify only on out-to-in transition
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MONITOR_ISSUE_NUMBER: '1'
        run: python3 stock_watch/gmailbuy_monitor.py
      - name: Prevent public repo schedule from disabling due to inactivity
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 stock_watch/keepalive.py
